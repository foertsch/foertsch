name: Metrics
on:
  schedule: [{cron: "0 4 * * 1"}]
  push: {branches: ["main"]}
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: foertsch/metrics@master
        with:
          token: ${{ secrets.GH_METRICS }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics-calendar.svg
          user: foertsch
          template: classic
          base: ""
          config_animations: yes
          config_timezone: Europe/Zurich
          plugin_calendar: yes
          plugin_calendar_limit: 1

      - uses: foertsch/metrics@master
        with:
          token: ${{ secrets.GH_METRICS }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: foertsch
          template: classic
          base: activity, community, repositories, metadata
          config_animations: yes
          config_timezone: Europe/Zurich
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_ignored: tex, less, dockerfile, makefile, shell, cmake
          plugin_habits: yes
          plugin_habits_from: 250
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

